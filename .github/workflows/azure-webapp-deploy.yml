name: Build and Deploy ASP.NET Core to Azure Web App

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish MyMvcApp.csproj -c Release -o "$PWD/bin/Release/net8.0/MyMvcApp"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mymvcapp-artifact
          path: bin/Release/net8.0/MyMvcApp

  deploy:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: mymvcapp-artifact
          path: published

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: published/MyMvcApp
